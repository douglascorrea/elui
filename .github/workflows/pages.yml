name: Pages

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure website analytics
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
        run: |
          test -n "$POSTHOG_PROJECT_TOKEN"
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("website/index.html")
          source = path.read_text()
          placeholder = "__POSTHOG_PROJECT_TOKEN__"
          if source.count(placeholder) != 1:
              raise SystemExit("expected exactly one PostHog token placeholder")
          path.write_text(source.replace(placeholder, os.environ["POSTHOG_PROJECT_TOKEN"]))
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
