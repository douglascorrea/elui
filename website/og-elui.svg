<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Elui — Terminal UIs for Elixir</title>
  <desc id="desc">A dark terminal-inspired card with Elui branding and a colorful terminal interface.</desc>
  <rect width="1200" height="630" fill="#10110d"/>
  <g stroke="#f1ecd9" stroke-opacity="0.055">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200M0 560H1200"/>
    <path d="M80 0V630M160 0V630M240 0V630M320 0V630M400 0V630M480 0V630M560 0V630M640 0V630M720 0V630M800 0V630M880 0V630M960 0V630M1040 0V630M1120 0V630"/>
  </g>
  <rect x="64" y="58" width="72" height="72" rx="13" fill="#c7ff45"/>
