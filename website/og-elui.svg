    <g fill="none" stroke-width="2">
      <rect x="30" y="88" width="370" height="86" rx="8" stroke="#3bd6cc"/>
      <rect x="30" y="194" width="176" height="94" rx="8" stroke="#c7ff45"/>
      <rect x="224" y="194" width="176" height="94" rx="8" stroke="#ff7248"/>
