    <text x="52" y="149" fill="#f1ecd9" font-family="ui-monospace, Menlo, monospace" font-size="20">frame diff  ████████░░</text>
    <text x="50" y="229" fill="#c7ff45" font-family="ui-monospace, Menlo, monospace" font-size="15">WIDGETS</text>
