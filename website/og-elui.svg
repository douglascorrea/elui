    <path d="M0 58H430" stroke="#f1ecd9" stroke-opacity="0.24"/>
    <circle cx="28" cy="29" r="7" fill="#ff7248"/>
    <circle cx="51" cy="29" r="7" fill="#f2b84b"/>
